# Zostaví Android aplikáciu (APK) a zverejní ju ako GitHub Release „apk“.
# Stiahnutie: https://github.com/Virivkyonline/video-zaznam/releases/download/apk/tlac-etikiet.apk
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'vendor/**'
      - 'icons/**'
      - 'index.html'
      - 'styles.css'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Podpisový kľúč zo secrets (ak je nastavený)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/release.keystore; fi

      - name: Zostaviť APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Pripraviť súbor
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tlac-etikiet.apk
          ls -la tlac-etikiet.apk
          unzip -l tlac-etikiet.apk | grep -E "assets/www/(index.html|js/app.js)|classes.dex"

      - uses: actions/upload-artifact@v4
        with:
          name: tlac-etikiet-apk
          path: tlac-etikiet.apk

      - name: Zverejniť (GitHub Release „apk“)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          sleep 3
          gh release create apk tlac-etikiet.apk \
            --target "$GITHUB_SHA" \
            --title "Tlač etikiet – Android aplikácia" \
            --notes "Android aplikácia na tlač etikiet na Bluetooth tlačiarni SK58. Stiahnite tlac-etikiet.apk do telefónu a nainštalujte (povoľte inštaláciu z tohto zdroja). Verzia z commitu ${GITHUB_SHA::7}."
